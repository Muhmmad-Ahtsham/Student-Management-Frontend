<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management Frontend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Student Management</h1>
  </header>

  <main class="container">
    <!-- Record count cards -->
    <section class="cards" aria-label="Record counts">
      <div class="card"><span id="countTotal">0</span><small>Total Students</small></div>
      <div class="card"><span id="countShown">0</span><small>Showing (filtered)</small></div>
      <div class="card"><span id="countDepts">0</span><small>Departments</small></div>
      <div class="card"><span id="countSems">0</span><small>Semesters in use</small></div>
    </section>

    <!-- Add / Edit form -->
    <section class="panel" aria-labelledby="formTitle">
      <h2 id="formTitle">Add Student</h2>
      <form id="studentForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" placeholder="e.g. Ali Ahmed">
            <span class="error" id="nameError"></span>
          </div>
          <div class="field">
            <label for="rollNo">Roll No</label>
            <input id="rollNo" name="rollNo" type="text" placeholder="e.g. 2k24-SE-01">
            <span class="error" id="rollNoError"></span>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="name@example.com">
            <span class="error" id="emailError"></span>
          </div>
          <div class="field">
            <label for="department">Department</label>
            <select id="department" name="department"></select>
            <span class="error" id="departmentError"></span>
          </div>
          <div class="field">
            <label for="semester">Semester</label>
            <select id="semester" name="semester"></select>
            <span class="error" id="semesterError"></span>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn primary" id="submitBtn">Add Student</button>
          <button type="button" class="btn" id="cancelBtn" hidden>Cancel Edit</button>
        </div>
        <p class="message" id="formMessage" role="status"></p>
      </form>
    </section>

    <!-- Search / Filter / Sort / Import / Export -->
    <section class="panel" aria-label="Search, filter and sort">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search name, roll no or email..." aria-label="Search">
        <select id="deptFilter" aria-label="Filter by department"></select>
        <select id="semFilter" aria-label="Filter by semester"></select>
        <select id="sortSelect" aria-label="Sort records">
          <option value="name-asc">Name (A-Z)</option>
          <option value="name-desc">Name (Z-A)</option>
          <option value="rollNo-asc">Roll No (asc)</option>
          <option value="semester-asc">Semester (low-high)</option>
          <option value="semester-desc">Semester (high-low)</option>
          <option value="department-asc">Department (A-Z)</option>
        </select>
        <button type="button" class="btn" id="clearFilters">Clear</button>
      </div>
      <div class="toolbar">
        <button type="button" class="btn" id="exportBtn">Export JSON</button>
        <label class="btn" for="importFile">Import JSON</label>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
    </section>

    <!-- Records table -->
    <section class="panel table-wrap" aria-label="Student records">
      <table>
        <caption class="sr-only">Student records</caption>
        <thead>
          <tr>
            <th>#</th><th>Roll No</th><th>Name</th><th>Email</th>
            <th>Department</th><th>Sem</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </section>
  </main>

  <!-- View dialog -->
  <dialog id="viewDialog">
    <h2>Student Details</h2>
    <dl id="viewBody"></dl>
    <button type="button" class="btn primary" id="closeView">Close</button>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
